name: check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s examples/fictional-order-service/tests -v
      - run: bash -n scripts/repo-preflight.sh
      - run: ./scripts/repo-preflight.sh --help
      - run: python3 -m py_compile scripts/check-change-scope.py scripts/check-report-redaction.py scripts/git-identity-guard.py examples/fictional-order-service/src/order_rules.py
      - run: python3 scripts/check-change-scope.py --help
      - run: python3 scripts/check-report-redaction.py --help
      - run: node --test
      - run: ./bin/prloop --help
      - run: python3 scripts/git-identity-guard.py --help
      # A fresh checkout has no local or staged changes, so check the committed range instead.
      - name: git diff --check (committed range)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            BASE=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
          fi
          git diff --check "$BASE" HEAD
